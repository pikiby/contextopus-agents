name: Agents validation
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Compatible Core commit or tag
        required: true
        default: main
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pikiby/contextopus-core
          ref: ${{ inputs.core_ref }}
          path: .ci/core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".ci/core[test]"
      - run: python -m pytest tests -q -o faulthandler_timeout=120
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: agents-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
